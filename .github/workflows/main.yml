name: Update GitHub Traffic

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tree (debug)
        run: |
          pwd
          ls -la
          echo "---- analysis ----"
          ls -la analysis || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A) 如果你有 analysis/requirements.txt，用这一段：
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt
          
      # - name: Install dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install requests pandas matplotlib

      - name: Run tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: |
          python analysis/github_traffic_tracker.py \
            --owner chentailia317-alt \
            --repo sleep-hygiene-intervention \
            --outdir analysis/traffic_out \
            --label "Sleep Hygiene Intervention"

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(analysis): refresh traffic charts"
          file_pattern: analysis/traffic_out/*
